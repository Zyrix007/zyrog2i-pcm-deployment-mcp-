name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system SQLite3 & Node N-API headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-0 libsqlite3-dev

      - name: Install dependencies
        run: npm install

      - name: Build native SQLite addon and TypeScript
        run: npm run build

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run unit, integration, and security tests
        run: npm test
